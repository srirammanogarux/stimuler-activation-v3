<!DOCTYPE html>
<html lang="en" data-theme="app">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stimuler · Activation v3</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="story.css">
</head>
<body>
<div class="stage">
  <div class="mockup" id="mockup">
  <div class="phone" id="phone">
    <div class="ambient"></div>

    <!-- ============ CHAT SHELL · the India onboarding UI ============ -->
    <main class="screen chat-screen" id="chatScreen">
      <header class="topbar" id="topbar">
        <div class="statusbar">
          <img src="assets/status-time.svg" alt="9:41" width="54" height="21">
          <img src="assets/status-right.svg" alt="" width="67" height="12">
        </div>
        <div class="progress-block">
          <p class="progress-label" id="progressLabel">Let’s get started</p>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="chat-stream" id="chatStream"></div>
      </div>

      <footer class="bottombar" id="bottomBar">
        <button class="pill pill-mute muted" id="muteBtn" disabled aria-disabled="true">
          <img src="assets/mic-mute.svg" alt=""> Mute
        </button>
        <button class="pill pill-skip" id="skipBtn">
          Skip <img src="assets/chevron-dbl.svg" alt="">
        </button>
      </footer>

      <div class="home-indicator"></div>
    </main>

    <!-- ============ STORY · 5 beats ============ -->
    <section class="screen story-screen is-hidden" id="storyScreen">
      <div class="st-dots"><i></i><i></i><i></i><i></i><i></i></div>

      <div class="st-beat" id="stB1">
        <video class="st-video" id="stV1" src="videos/deadline.mp4" muted playsinline preload="auto" loop></video>
        <div class="st-shade"></div>
        <p class="st-eyebrow" id="stE1"></p>
        <p class="st-thought" id="stT1"></p>
      </div>

      <div class="st-beat" id="stB2">
        <video class="st-video" id="stV2" src="videos/dread.mp4" muted playsinline preload="auto" loop></video>
        <div class="st-shade"></div>
        <p class="st-eyebrow" id="stE2"></p>
        <p class="st-thought" id="stT2"></p>
      </div>

      <div class="st-beat" id="stB3">
        <video class="st-video" id="stV3" src="videos/walk.mp4" muted playsinline preload="auto" loop></video>
        <div class="st-shade"></div>
        <p class="st-eyebrow" id="stE3"></p>
        <p class="st-thought" id="stT3"></p>
      </div>

      <div class="st-beat st-clash" id="stB4">
        <div class="clash-half clash-l"></div>
        <div class="clash-half clash-r"></div>
        <div class="fighter f-you">
          <div class="f-circle"><img src="assets/you.png" alt=""></div><p>YOU</p>
        </div>
        <div class="fighter f-them">
          <div class="f-circle"><img src="assets/manager.png" alt=""></div><p id="stThem">THE MANAGER</p>
        </div>
        <div class="vs-wrap"><span class="vs">VS</span>
          <svg class="bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5h5L9.5 22 19 9.5h-5.5L13 2Z"/></svg>
        </div>
        <p class="clash-tag" id="stTag"></p>
        <div class="flash"></div>
      </div>

      <div class="st-beat st-mission" id="stB5">
        <p class="sm-label">Your mission</p>
        <h2 class="sm-objective" id="smObjective"></h2>
        <div class="sm-win"><span class="star">★</span><span id="smWin"></span></div>
        <p class="sm-tip" id="smTip"></p>
        <p class="sm-timer" id="smTimer"></p>
        <button class="sm-cta" id="smCta">Start</button>
      </div>
    </section>

  </div>
  </div>
</div>

<script src="story.js"></script>
<script src="flow.js"></script>
</body>
</html>
